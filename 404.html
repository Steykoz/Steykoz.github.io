<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page introuvable | Stey</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23a855f7'/%3E%3Cstop offset='100%25' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='4' y='26' font-family='Arial' font-weight='bold' font-size='26' fill='url(%23g)'%3ES%3C/text%3E%3Ccircle cx='26' cy='24' r='3' fill='%23fb923c'/%3E%3C/svg%3E">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0B0B0E;
            color: #e2e8f0;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .code {
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7, #f472b6, #fb923c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            animation: glitch 3s infinite;
        }
        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-3px, 2px); }
            94% { transform: translate(3px, -2px); }
            96% { transform: translate(-2px, -1px); }
            98% { transform: translate(2px, 1px); }
        }
        .msg {
            font-size: 1.3rem;
            color: #94a3b8;
            margin: 16px 0 8px;
        }
        .sub {
            color: #64748b;
            margin-bottom: 40px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 12px;
            background: linear-gradient(135deg, #a855f7, #f472b6);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.4);
        }
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
        }
        .particles span {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #a855f7;
            border-radius: 50%;
            opacity: 0;
            animation: float 6s infinite;
        }
        @keyframes float {
            0% { opacity: 0; transform: translateY(100vh) scale(0); }
            50% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1); }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="container">
        <div class="code">404</div>
        <p class="msg">Cette page a pris la fuite.</p>
        <p class="sub">Soit elle n'existe pas, soit elle est partie en vacances sans prevenir.</p>
        <a href="/" class="btn">Retour a l'accueil</a>
    </div>
    <script>
        const p = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const s = document.createElement('span');
            s.style.left = Math.random() * 100 + '%';
            s.style.animationDelay = Math.random() * 6 + 's';
            s.style.animationDuration = (4 + Math.random() * 4) + 's';
            p.appendChild(s);
        }
    </script>
</body>
</html>
